message RepairRequest {
  optional sint32 owner = 1 [(gogoproto.nullable) = false, (gogoproto.customname) = "Owner", (gogoproto.jsontag) = "Owner"];
  optional sint32 slot = 2 [(gogoproto.nullable) = false, (gogoproto.customname) = "Slot", (gogoproto.jsontag) = "Slot"];
}

