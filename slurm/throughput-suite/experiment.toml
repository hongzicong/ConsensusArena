name = "ring7-B-zipf099-load"
# Each protocol has one adaptive Slurm worker (1 node, 15 tasks, 2 CPUs/task).
# launch.ps1 uploads immutable inputs and submits workers concurrently; plan is read-only.
# Every replica: GOMAXPROCS=1 plus taskset on one logical CPU; infrastructure is separate.
protocols = ["agreement", "paxos", "swiftpaxos", "bodega", "kcensus", "pqlfrontier"]
template = "../kcensus-suite/n7-c7-topology-00"
profile = "B"
resources = false
# CPU and memory sampling belongs to scalability; throughput keeps it off.

[search]
start = 500
ceiling = 1024000
coarse_step = 2000
step_floor = 500
latency_cap_ms = 400.0
knee_factor = 1.2
attempts = 2
# A timeout is a valid unsustained observation; both attempts are preserved.
# Invalid infrastructure/measurement evidence exhausts retries then fails the series.
# No KCensus plotting monotonicity filter, edge trimming, or throughput estimator is used.
