-- Replicas --
replica-ap-northeast-1 0.0.0.1
replica-ap-south-1 0.0.0.2
replica-ap-southeast-1 0.0.0.3
replica-ca-central-1 0.0.0.4
replica-eu-south-1 0.0.0.5
replica-eu-west-1 0.0.0.6
replica-us-west-2 0.0.0.7

-- Clients --
client-ap-northeast-1 0.0.1.1
client-ap-south-1 0.0.1.2
client-ap-southeast-1 0.0.1.3
client-ca-central-1 0.0.1.4
client-eu-south-1 0.0.1.5
client-eu-west-1 0.0.1.6
client-us-west-2 0.0.1.7

-- Master --
m0 0.0.2.1

// Parameter template; generate a deployment configuration before use.
// From ConsensusArena/: python slurm/topology.py prepare OUTPUT --replicas 5 --topology 1
// Replica/client membership comes from topologies.json.
// topology.py generates Master, Proxy and keyMappingSeed (the topology ID).

// Shared process and protocol settings.
masterPort: 7087
port: 7070
protocol: SwiftPaxos

noop: false
thrifty: false
optread: false
leaderless: false
fast: true
waitClosest: true

// Bodega timing from Summerset 16c6f352, scripts/bodega/bench_ycsb_zk_etcd.py.
bodegaLease: 2500ms
bodegaHeartbeat: 120ms
bodegaFailure: 1200ms
bodegaFailureMax: 2400ms

// Request mix, payload and logical clients.
writes: 50
commandSize: 16
clones: 0

// Offered load and observation window.
arrivalRate: 2857.14285714286
warmup: 5s
duration: 10s
repetitions: 1

// Key distribution and independent request-sampling seed.
keyCount: 100000
zipfSkew: 0.99
// One fixed permutation for every client; false restores ordered Zipf keys.
shuffleKeys: true
workloadSeed: 1

// Initial dataset.
preload: true
preloadSeed: 1

keyMappingSeed: 1

-- Proxy --
server_alias replica-ap-northeast-1
client-ap-northeast-1 (local)

server_alias replica-ap-south-1
client-ap-south-1 (local)

server_alias replica-ap-southeast-1
client-ap-southeast-1 (local)

server_alias replica-ca-central-1
client-ca-central-1 (local)

server_alias replica-eu-south-1
client-eu-south-1 (local)

server_alias replica-eu-west-1
client-eu-west-1 (local)

server_alias replica-us-west-2
client-us-west-2 (local)

---
agreementAblation: no-hot
